name: Release

# Bumps the version with Bubblewrap, builds the signed bundle and creates a DRAFT production
# release in Play Console, with "Bug fixes and performance improvements" as its notes. Review it
# there and click "Send for review".
# Then commits the bump and the regenerated Android project to main.
#
# Deploy the site first: `bubblewrap update` reads the live web manifest, icons and shortcuts.
#
# Secrets: PLAY_SERVICE_ACCOUNT_JSON (needs access to this app in Play Console), KEYSTORE_BASE64
# (`base64 -i android/android.keystore`), KEYSTORE_PASSWORD and KEY_PASSWORD. The key alias
# comes from twa-manifest.json.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PACKAGE: app.cuenext.pinya

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Bubblewrap only accepts JDK 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      # Bubblewrap asks where the JDK and the Android SDK are on its first run; answer it with
      # the runner's own. It only checks the SDK folder has bin/ or tools/, so the runner's SDK
      # gets an empty bin/, and the build-tools version it wants is installed up front with the
      # runner's sdkmanager instead of its own.
      - name: Configure Bubblewrap
        run: |
          core="$(npm root -g)/@bubblewrap/cli/node_modules/@bubblewrap/core"
          [ -d "$core" ] || core="$(npm root -g)/@bubblewrap/core"
          build_tools=$(sed -nE "s/.*BUILD_TOOLS_VERSION = '([^']+)'.*/\1/p" "$core/dist/lib/androidSdk/AndroidSdkTools.js")
          [ -n "$build_tools" ] || { echo "Could not read Bubblewrap's build-tools version"; exit 1; }
          echo "Bubblewrap wants build-tools $build_tools"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$build_tools" > /dev/null
          [ -e "$ANDROID_HOME/bin" ] || sudo mkdir "$ANDROID_HOME/bin"

          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Update the Android project
        working-directory: android
        run: |
          bubblewrap update
          ./apply-assets.sh

      - name: Build signed bundle
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          bubblewrap build --signingKeyPath="$RUNNER_TEMP/release.keystore"
          rm "$RUNNER_TEMP/release.keystore"

      - name: Read version
        id: version
        run: echo "code=$(jq -r .appVersionCode android/twa-manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ steps.version.outputs.code }}
          path: android/app-release-bundle.aab
          retention-days: 30

      - name: Create draft release in Play Console
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests
          python3 .github/release/play.py upload \
            --package "$PACKAGE" \
            --aab android/app-release-bundle.aab \
            --version-code "${{ steps.version.outputs.code }}"

      - name: Commit the release
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Release $CODE"
          git push origin HEAD:main
          {
            echo "## v$CODE"
            echo
            echo "Draft created in Play Console. Review it and click **Send for review**."
            echo "The bundle is also attached to this run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"
